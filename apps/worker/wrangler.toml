name = "watchparty-worker"
main = "src/index.ts"
compatibility_date = "2026-11-21"
workers_dev = true

# URLs configuráveis. MINI_APP_URL é provisória até a Etapa 2 (o Pages ainda não existe).
# Ajuste WORKER_URL após o primeiro deploy (ele é usado pelo script de webhook).
[vars]
MINI_APP_URL = "https://watchparty-miniapp.pages.dev"
WORKER_URL = "https://watchparty-worker.watchparty-gabriel.workers.dev"
TELEGRAM_BOT_USERNAME = "lagostaanimobot"
MINI_APP_SHORT_NAME = "play"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
